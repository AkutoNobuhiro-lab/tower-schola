&lt;h1&gt;同じ層間変形でも、ダンパーの動きは変わる&lt;/h1&gt;

&lt;div class=&quot;controls&quot;&gt;&lt;button id=&quot;play&quot;&gt;▶ 再生&lt;/button&gt;&lt;button id=&quot;stop&quot;&gt;一時停止&lt;/button&gt;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;repeat&quot; checked style=&quot;width:auto&quot;&gt;繰り返す&lt;/label&gt;&lt;strong id=&quot;drift&quot;&gt;&lt;/strong&gt;&lt;/div&gt;
&lt;label for=&quot;move&quot;&gt;層間変位 δ（−10 ～ ＋10 cm）&lt;/label&gt;&lt;br&gt;&lt;input id=&quot;move&quot; type=&quot;range&quot; min=&quot;-10&quot; max=&quot;10&quot; step=&quot;0.01&quot; value=&quot;0&quot;&gt;
&lt;div class=&quot;panels&quot;&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;① ブレース型：対角線上に直接配置&lt;/h2&gt;&lt;svg id=&quot;brace&quot; viewBox=&quot;0 0 440 340&quot; role=&quot;img&quot; aria-label=&quot;斜めに直接配置したダンパー&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;metric&quot; id=&quot;bval&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;div id=&quot;bbar&quot; class=&quot;fill blue&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;② トグル型：関節の動きを利用&lt;/h2&gt;&lt;svg id=&quot;toggle&quot; viewBox=&quot;0 0 440 340&quot; role=&quot;img&quot; aria-label=&quot;2本の腕と関節に接続したダンパー&quot;&gt;&lt;/svg&gt;&lt;div class=&quot;metric&quot; id=&quot;tval&quot;&gt;&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;div id=&quot;tbar&quot; class=&quot;fill orange&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;実線：変形後 ／ 破線：変形前 ／ 色付き筒：ダンパー ／ 灰色の線：長さ一定の腕・接続材&lt;br&gt;フレームの変形は見やすく2倍表示。数値と棒グラフは実変位、左右の棒グラフは同じ縮尺です。＋は伸び、−は縮み。&lt;/p&gt;
&lt;table&gt;&lt;tr&gt;&lt;th&gt;層間変位 ＋1 cm付近&lt;/th&gt;&lt;th&gt;ブレース型&lt;/th&gt;&lt;th&gt;トグル型&lt;/th&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;ダンパーの伸縮量（絶対値）&lt;/td&gt;&lt;td&gt;約0.83 cm&lt;/td&gt;&lt;td&gt;約2.02 cm&lt;/td&gt;&lt;/tr&gt;&lt;/table&gt;
&lt;p&gt;ブレース型では、水平の層間変位のうち、斜材方向の成分がダンパーを動かします。トグル型では、2本の腕の角度変化で関節が移動し、その動きをダンパーに伝えます。小さな層間変位でも、ダンパーの伸縮を大きくできます。&lt;/p&gt;

&lt;script&gt;
const W=6,H=4,D=Math.hypot(W,H),L=D/2*1.03;
function knee(u){const x=W+u,d=Math.hypot(x,H),q=Math.sqrt(L*L-d*d/4);return [x/2-H/d*q,H/2+x/d*q]}
const dist=(a,b)=&gt;Math.hypot(a[0]-b[0],a[1]-b[1]);
const p0=knee(0),t0=dist(p0,[W,0]);
const pos=p=&gt;[45+p[0]*50,275-p[1]*50];
const path=ps=&gt;ps.map((p,i)=&gt;(i?&#x27;L&#x27;:&#x27;M&#x27;)+pos(p).join(&#x27;,&#x27;)).join(&#x27; &#x27;);
function line(a,b,color,width=3,dash=&#x27;&#x27;){return `&lt;path d=&quot;${path([a,b])}&quot; fill=&quot;none&quot; stroke=&quot;${color}&quot; stroke-width=&quot;${width}&quot; ${dash?&#x27;stroke-dasharray=&quot;&#x27;+dash+&#x27;&quot;&#x27;:&#x27;&#x27;}/&gt;`}
function damper(a,b,color){const p=pos(a),q=pos(b),dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;return `&lt;g transform=&quot;translate(${p}) rotate(${ang})&quot;&gt;&lt;line x1=&quot;0&quot; x2=&quot;${len}&quot; stroke=&quot;${color}&quot; stroke-width=&quot;4&quot;/&gt;&lt;rect x=&quot;${len*.36}&quot; y=&quot;-8&quot; width=&quot;${len*.28}&quot; height=&quot;16&quot; rx=&quot;2&quot; fill=&quot;white&quot; stroke=&quot;${color}&quot; stroke-width=&quot;3&quot;/&gt;&lt;/g&gt;`}
function render(id,u,toggle){const A=[0,0],B=[W+u,H],C=[W,0],E=[u,H],P=knee(u),color=toggle?&#x27;#dc6a21&#x27;:&#x27;#1479bd&#x27;;let s=&#x27;&lt;title&gt;&#x27;+(toggle?&#x27;トグル型&#x27;:&#x27;ブレース型&#x27;)+&#x27;&lt;/title&gt;&#x27;;
 s+=line(A,[0,H],&#x27;#b9c5ce&#x27;,2,&#x27;5 5&#x27;)+line([0,H],[W,H],&#x27;#b9c5ce&#x27;,2,&#x27;5 5&#x27;)+line([W,H],C,&#x27;#b9c5ce&#x27;,2,&#x27;5 5&#x27;);
 s+=line(A,E,&#x27;#304859&#x27;,5)+line(E,B,&#x27;#304859&#x27;,7)+line(B,C,&#x27;#304859&#x27;,5)+line([-.5,-.15],[6.5,-.15],&#x27;#526577&#x27;,2);
 if(toggle){s+=line(A,p0,&#x27;#c6cdd3&#x27;,2,&#x27;5 5&#x27;)+line(p0,[W,H],&#x27;#c6cdd3&#x27;,2,&#x27;5 5&#x27;)+line(A,P,&#x27;#657481&#x27;,5)+line(P,B,&#x27;#657481&#x27;,5)+damper(C,P,color);const xy=pos(P);s+=`&lt;circle cx=&quot;${xy[0]}&quot; cy=&quot;${xy[1]}&quot; r=&quot;6&quot; fill=&quot;white&quot; stroke=&quot;${color}&quot; stroke-width=&quot;3&quot;/&gt;&lt;text x=&quot;${xy[0]-12}&quot; y=&quot;${xy[1]-15}&quot; text-anchor=&quot;end&quot;&gt;てこの原理&lt;/text&gt;`}
 else{s+=line(A,[W,H],&#x27;#c6cdd3&#x27;,2,&#x27;5 5&#x27;)+damper(A,B,color)}
 s+=`&lt;text x=&quot;45&quot; y=&quot;36&quot;&gt;梁の水平移動 δ →&lt;/text&gt;&lt;text x=&quot;45&quot; y=&quot;313&quot;&gt;固定柱脚&lt;/text&gt;&lt;text x=&quot;320&quot; y=&quot;313&quot;&gt;固定柱脚&lt;/text&gt;`;
 document.getElementById(id).innerHTML=s;
}
const slider=document.getElementById(&#x27;move&#x27;);let raf=0,start=null;
function draw(){const cm=+slider.value,u=cm/100,b=(Math.hypot(W+u,H)-D)*100,t=(dist(knee(u),[W,0])-t0)*100;render(&#x27;brace&#x27;,u*2,false);render(&#x27;toggle&#x27;,u*2,true);document.getElementById(&#x27;drift&#x27;).textContent=&#x27;層間変位 δ = &#x27;+cm.toFixed(2)+&#x27; cm&#x27;;document.getElementById(&#x27;bval&#x27;).textContent=&#x27;伸縮量 x = &#x27;+b.toFixed(2)+&#x27; cm&#x27;;document.getElementById(&#x27;tval&#x27;).textContent=&#x27;伸縮量 x = &#x27;+t.toFixed(2)+&#x27; cm&#x27;;document.getElementById(&#x27;bbar&#x27;).style.width=Math.abs(b)/25*100+&#x27;%&#x27;;document.getElementById(&#x27;tbar&#x27;).style.width=Math.abs(t)/25*100+&#x27;%&#x27;}
function stop(){cancelAnimationFrame(raf)}
function tick(t){if(start===null)start=t;let phase=(t-start)/7000;if(phase&gt;=1&amp;&amp;!document.getElementById(&#x27;repeat&#x27;).checked){slider.value=0;draw();return}slider.value=(10*Math.sin(phase*2*Math.PI)).toFixed(2);draw();raf=requestAnimationFrame(tick)}
document.getElementById(&#x27;play&#x27;).onclick=()=&gt;{stop();start=null;raf=requestAnimationFrame(tick)};document.getElementById(&#x27;stop&#x27;).onclick=stop;slider.oninput=()=&gt;{stop();draw()};draw();if(!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches)raf=requestAnimationFrame(tick);
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;

&lt;div class=&quot;eyebrow&quot;&gt;タワー・スコラ ／ 免震のしくみ&lt;/div&gt;
&lt;h1&gt;建物を支えながら、揺れを伝わりにくく。&lt;/h1&gt;
&lt;p&gt;免震層が横に変形することで、地面の急な動きが上の建物に伝わるのを抑えます。&lt;/p&gt;
&lt;div class=&quot;tabs&quot; role=&quot;group&quot; aria-label=&quot;説明の切り替え&quot;&gt;&lt;button id=&quot;compare-tab&quot; aria-pressed=&quot;true&quot;&gt;① 非免震と免震の比較&lt;/button&gt;&lt;button id=&quot;rubber-tab&quot; aria-pressed=&quot;false&quot;&gt;② 積層ゴムの拡大&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;button id=&quot;play&quot;&gt;一時停止&lt;/button&gt;&lt;button id=&quot;reset&quot;&gt;初期位置へ&lt;/button&gt;&lt;label for=&quot;speed&quot;&gt;再生速度&lt;/label&gt;&lt;select id=&quot;speed&quot; style=&quot;font:inherit;padding:10px&quot;&gt;&lt;option value=&quot;0.5&quot;&gt;ゆっくり&lt;/option&gt;&lt;option value=&quot;1&quot; selected&gt;標準&lt;/option&gt;&lt;/select&gt;&lt;/div&gt;
&lt;div class=&quot;progress-label&quot;&gt;&lt;label for=&quot;phase&quot;&gt;動きを手で確認&lt;/label&gt;&lt;span&gt;左・中央・右へ動かせます&lt;/span&gt;&lt;/div&gt;&lt;input id=&quot;phase&quot; class=&quot;slider&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;1000&quot; value=&quot;0&quot; aria-label=&quot;揺れの1周期内の位置&quot;&gt;
&lt;section id=&quot;compare&quot;&gt;&lt;div class=&quot;panels&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 class=&quot;orange&quot;&gt;非免震&lt;/h2&gt;&lt;canvas id=&quot;normal&quot; width=&quot;560&quot; height=&quot;370&quot; role=&quot;img&quot; aria-label=&quot;地面の揺れが建物に伝わり、建物も変形する模式アニメーション&quot;&gt;&lt;/canvas&gt;&lt;p&gt;地面の動きが、建物に伝わります。&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;h2 class=&quot;blue&quot;&gt;免震&lt;/h2&gt;&lt;canvas id=&quot;isolated&quot; width=&quot;560&quot; height=&quot;370&quot; role=&quot;img&quot; aria-label=&quot;免震装置が横に変形し、上の建物の揺れが小さくなる模式アニメーション&quot;&gt;&lt;/canvas&gt;&lt;p&gt;免震層が変形し、上の建物の揺れを抑えます。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;callout&quot;&gt;左右の地面には、同じ動きを与えています。&lt;/p&gt;&lt;/section&gt;
&lt;section id=&quot;rubber&quot; hidden&gt;&lt;div class=&quot;card rubber-grid&quot;&gt;&lt;canvas id=&quot;detail&quot; width=&quot;600&quot; height=&quot;410&quot; role=&quot;img&quot; aria-label=&quot;鋼板とゴムを重ねた積層ゴムが水平方向に変形し、内部の錫も変形する断面模式図&quot;&gt;&lt;/canvas&gt;&lt;div&gt;&lt;h2&gt;重さを支え、横には柔らかく。&lt;/h2&gt;&lt;p class=&quot;label blue&quot;&gt;ゴムと鋼板を交互に重ねる&lt;/p&gt;&lt;p&gt;鋼板がゴムの横へのはらみ出しを抑え、建物の重さを支えます。水平方向には柔らかく変形します。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;note&quot;&gt;積層ゴムの断面イメージ。&lt;/p&gt;&lt;/section&gt;
&lt;footer&gt;&lt;h2&gt;タワー・スコラでは&lt;/h2&gt;&lt;p&gt;地下1階と1階の間に免震層を設けています。錫プラグ入り積層ゴム17基、天然ゴム積層ゴム7基、直動転がり支承6基を組み合わせています。&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;建物情報の出典：&lt;a href=&quot;https://www.arch.cst.nihon-u.ac.jp/wordpress/wp-content/uploads/2023/02/SK_2019_04.pdf&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;日本大学理工学部建築学科『駿建』2019年4月号 p.6&lt;/a&gt;&lt;/p&gt;&lt;/footer&gt;
&lt;script&gt;
(()=&gt;{&#x27;use strict&#x27;;
const $=id=&gt;document.getElementById(id),tau=2*Math.PI;let phase=0,last=null,playing=!matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
const colors={ink:&#x27;#193044&#x27;,blue:&#x27;#1479bd&#x27;,orange:&#x27;#d27625&#x27;,gray:&#x27;#788b98&#x27;};
function line(c,x,y,X,Y,color,w=3){c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x,y);c.lineTo(X,Y);c.stroke()}
function rect(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function text(c,x,y,t,size=18,col=colors.ink){c.font=size+&#x27;px system-ui,sans-serif&#x27;;c.fillStyle=col;c.fillText(t,x,y)}
function rubber(c,x,y,bot,top,w,h,core=false){for(let j=0;j&lt;10;j++){let a=x+top+(bot-top)*j/10,b=x+top+(bot-top)*(j+1)/10,Y=y+j*h/10;c.fillStyle=j%2?&#x27;#d7e3e9&#x27;:&#x27;#6e9db2&#x27;;c.beginPath();c.moveTo(a-w/2,Y);c.lineTo(a+w/2,Y);c.lineTo(b+w/2,Y+h/10);c.lineTo(b-w/2,Y+h/10);c.closePath();c.fill()}rect(c,x+top-w/2-6,y-4,w+12,6,colors.ink);rect(c,x+bot-w/2-6,y+h-2,w+12,6,colors.ink);if(core)line(c,x+top,y,x+bot,y+h,colors.orange,13)}
function building(id,iso){let c=$(id).getContext(&#x27;2d&#x27;);c.clearRect(0,0,560,370);let g=25*Math.sin(phase),b=iso?6*Math.sin(phase):g,roof=iso?b:39*Math.sin(phase),color=iso?colors.blue:colors.orange;
 // 地表面と1階床を同じ高さに。免震装置は地表より下のピットに置く。
 if(iso){
 rect(c,20+g,245,85,100,&#x27;#d9d1c2&#x27;);rect(c,415+g,245,125,100,&#x27;#d9d1c2&#x27;);
 rect(c,95+g,245,10,85,&#x27;#879aa6&#x27;);rect(c,415+g,245,10,85,&#x27;#879aa6&#x27;);rect(c,95+g,312,330,18,&#x27;#879aa6&#x27;);
 line(c,20+g,245,105+g,245,colors.gray,3);line(c,415+g,245,540+g,245,colors.gray,3);
 }else{rect(c,20+g,245,520,100,&#x27;#d9d1c2&#x27;);rect(c,147+g,245,226,25,&#x27;#879aa6&#x27;);line(c,20+g,245,540+g,245,colors.gray,3)}
 c.fillStyle=&#x27;#e5eef4&#x27;;c.strokeStyle=color;c.lineWidth=4;c.beginPath();c.moveTo(165+roof,30);c.lineTo(355+roof,30);c.lineTo(355+b,245);c.lineTo(165+b,245);c.closePath();c.fill();c.stroke();
 for(let j=0;j&lt;5;j++)for(let k=0;k&lt;4;k++){let y=45+j*39,s=roof+(b-roof)*(y-30)/215;rect(c,180+k*43+s,y,25,22,&#x27;white&#x27;)}
 line(c,147+b,245,373+b,245,colors.ink,6);
 text(c,435+g,233,&#x27;地表面&#x27;,16);text(c,300+b,233,&#x27;1階&#x27;,16);
 if(iso){for(let x of [180,260,340])rubber(c,x,255,g,b,48,53);
 text(c,190+g,349,&#x27;地下の免震ピット&#x27;,16,colors.blue);
 // 移動する床とピット壁との空間を表示する。
